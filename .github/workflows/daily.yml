name: Catlion Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect US social sentiment
        env:
          TRENDING_SYMBOLS: "10"
          MESSAGES_PER_SYMBOL: "30"
          REQUEST_DELAY: "0.25"
          WATCHLIST: "ONDS,NVDA,AMD,TSLA,AAPL,MSFT,AMZN,META,GOOGL,AVGO,PLTR,SOFI,RKLB,SPY,QQQ"
        run: python scraper.py

      - name: Save updated data.json
        run: |
          git config user.name "catlion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update US watchlist sentiment data"
          git push
