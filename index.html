<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catlion · US Stock Social Sentiment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">🦁 Catlion</div>
    <div class="sub">US Stocks / ETFs · Watchlist + Trending</div>
  </div>
  <div id="updated" class="updated">Loading…</div>
</header>

<main>
  <section class="hero">
    <div>
      <h1>今日美股社群情緒</h1>
      <p>固定監察 Watchlist，同時加入 Stocktwits Trending 發現新股票。</p>
    </div>
    <input id="search" type="search" placeholder="搜尋 ONDS、NVDA、SPY、QQQ…">
  </section>

  <section id="stats" class="stats"></section>

  <section>
    <div class="section-title">
      <h2>美股 / ETF</h2>
      <span id="sourceNote"></span>
    </div>
    <div id="stocks" class="grid"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
