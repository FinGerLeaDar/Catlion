<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catlion · Social Stock Sentiment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><div class="brand">🦁 Catlion</div><div class="sub">PTT + Dcard 股票社群情報</div></div>
  <div id="updated" class="updated">Loading…</div>
</header>

<main>
  <section class="hero">
    <div>
      <h1>今日社群情緒</h1>
      <p>自動整理 PTT / Dcard 討論，再由 AI 做結構化分析。</p>
    </div>
    <input id="search" type="search" placeholder="搜尋股票，例如 ONDS、NVDA">
  </section>

  <section id="stats" class="stats"></section>
  <section>
    <div class="section-title"><h2>熱門股票</h2><span id="sourceNote"></span></div>
    <div id="stocks" class="grid"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
